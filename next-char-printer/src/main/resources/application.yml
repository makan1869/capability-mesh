server:
  port: 8085

spring:
  application:
    name: next-char-printer
  ai:
    mcp:
      server:
        name: next-char-printer
        version: 0.1.0
        type: SYNC
        protocol: STREAMABLE
        instructions: "Exposes a single 'next_character' tool that returns the next letter of the alphabet, cycling from 'Z' back to 'A' (and 'z' back to 'a')."
        annotation-scanner:
          enabled: true

# Registers this server with the MCP registry on startup (see registry-publisher).
capability-mesh:
  registry:
    url: ${MCP_REGISTRY_URL:http://localhost:8090}
    title: Next Char Printer
    description: "Returns the next letter of the alphabet, cycling from 'Z' back to 'A'."
