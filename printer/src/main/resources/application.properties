spring.application.name=printer

# This app is a one-shot client/orchestrator, not a server - no embedded web
# server is on the classpath, so it starts, runs, and exits without a port.

# Where to discover this mesh's MCP servers from.
printer.registry.url=http://localhost:8090

# --- Anthropic (Spring AI) ---
# Placeholders: fill these in, or set the equivalent environment variables.
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:PUT_YOUR_ANTHROPIC_API_KEY_HERE}
spring.ai.anthropic.chat.model=claude-sonnet-5-5

# Reasoning effort for the model (low, medium, high, xhigh, max - case-insensitive,
# PrintAbcRunner lowercases it before sending). No official Spring AI property
# exists for this - see AnthropicChatOptions.builder().effort(...) in
# PrintAbcRunner - so it's our own app-specific property.
printer.anthropic.effort=medium
